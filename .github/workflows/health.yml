name: Health Check

# The failure this exists for is silence: if the token expires or Actions stops
# firing, the dashboard keeps rendering the last snapshot and looks fine. This
# runs independently of the scrapers so it also catches "the scraper workflows
# never ran at all".
on:
  schedule:
    - cron: '0 */2 * * *' # every 2 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history so the newest data commit's age can be measured.
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Check snapshot and run freshness
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          CLAN_TAG: ${{ secrets.CLAN_TAG }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scrapers/watchdog.py
