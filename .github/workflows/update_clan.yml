name: Update Clan Data (Daily)
on:
  schedule:
    - cron: '0 9 * * *' # Runs once a day at 9am UTC
  workflow_dispatch:

jobs:
  update-clan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # default token is read-only; the Commit+Push step needs write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests python-dotenv

      - name: Run Clan Scraper
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          CLAN_TAG: ${{ secrets.CLAN_TAG }}
          COC_API_BASE_URL: https://cocproxy.royaleapi.dev/v1
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/scrapers
          python scrapers/clan_scraper.py
          python scrapers/player_scraper.py
          python scrapers/meta_scraper.py

      - name: Notify Discord
        # Best-effort: a missing secret or a Discord outage must not fail the run.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/scrapers
          python scrapers/notify.py --event clan

      - name: Commit and Push
        run: |
          git config --global user.name "Stats Bot"
          git config --global user.email "bot@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Auto-update clan members"
          git push
