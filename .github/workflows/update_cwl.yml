name: Update CWL Standings (15m)
# League standings move on battle day, so a daily fetch leaves them a day
# stale — which is exactly the moment they matter.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# All scrapers commit to the same branch; serialise them so two 15-minute runs
# cannot collide on `git push`.
concurrency:
  group: scrapers-commit
  cancel-in-progress: false

jobs:
  update-cwl:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # default token is read-only; the Commit+Push step needs write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests python-dotenv

      - name: Fetch league group
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          CLAN_TAG: ${{ secrets.CLAN_TAG }}
          COC_API_BASE_URL: https://cocproxy.royaleapi.dev/v1
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/scrapers
          python scrapers/cwl_scraper.py

      - name: Commit and Push
        run: |
          git config --global user.name "Stats Bot"
          git config --global user.email "bot@github.com"
          git add data/meta.json
          if git diff --cached --quiet; then
            echo "No CWL change; skipping commit."
          else
            git commit -m "Auto-update CWL standings"
            git pull --rebase --autostash origin main
            git push
          fi