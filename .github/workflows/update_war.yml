name: Update War Stats (15m)
on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch:

# All three scrapers commit to the same branch; serialise them so a 15-minute
# war run and the daily clan run cannot collide on `git push`.
concurrency:
  group: scrapers-commit
  cancel-in-progress: false

jobs:
  update-war:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # default token is read-only; the Commit+Push step needs write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests python-dotenv

      - name: Run War Scraper
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          CLAN_TAG: ${{ secrets.CLAN_TAG }}
          COC_API_BASE_URL: https://cocproxy.royaleapi.dev/v1
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/scrapers
          python scrapers/war_scraper.py
          python scrapers/warlog_scraper.py

      - name: Notify Discord
        # Best-effort: a missing secret or a Discord outage must not fail the run.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/scrapers
          python scrapers/notify.py --event war

      - name: Commit and Push
        run: |
          git config --global user.name "Stats Bot"
          git config --global user.email "bot@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Auto-update war stats"
          # Another workflow may have pushed since checkout; replay our commit on top.
          git pull --rebase --autostash origin main
          git push
